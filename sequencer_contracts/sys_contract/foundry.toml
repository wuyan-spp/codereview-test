[profile.default]
src = 'artifact_src/solidity'
out = 'artifact'
libs = ["lib"]
optimizer = true
optimizer_runs = 10000
via_ir = true
solc_version = "0.8.27"

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

[dependencies]
openzeppelin-contracts = "OpenZeppelin/openzeppelin-contracts@v5.4.0"
forge-std = "foundry-rs/forge-std@1.10.0"
