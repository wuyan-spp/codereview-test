[profile.default]
src = "src"
out = "out"
libs = ["lib"]

cache_path = 'cache_forge'
fs_permissions = [{ access = "read-write", path = "./" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "on-chain-pccs/=lib/automata-dcap-attestation/evm/lib/automata-on-chain-pccs/src/",
    "dcap-attestation/=lib/automata-dcap-attestation/evm/contracts/",
    "solady/=lib/automata-dcap-attestation/evm/lib/automata-on-chain-pccs/lib/solady/src/",
    "p256-verifier/=lib/automata-dcap-attestation/evm/lib/automata-on-chain-pccs/lib/p256-verifier/src/",
    "@automata-network/on-chain-pccs/=lib/automata-dcap-attestation/evm/lib/automata-on-chain-pccs/src/",
    "risc0/=lib/automata-dcap-attestation/evm/lib/risc0-ethereum/contracts/src/",
    # foundry is not able to detect this particular remapping for some reason...
    "@openzeppelin/=lib/automata-dcap-attestation/evm/lib/risc0-ethereum/lib/openzeppelin-contracts/",
    "@sp1-contracts/=lib/automata-dcap-attestation/evm/lib/sp1-contracts/contracts/src/",
]

solc = "0.8.27"
optimizer = true
optimizer_runs = 200

# Useful link: https://github.com/foundry-rs/foundry/issues/3507
via_ir = true
evm_version = "paris"

ffi = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
