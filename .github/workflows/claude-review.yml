name: Claude Code Review

# Trigger on new / updated PRs and on @claude mentions in comments.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Default minimal permissions; each job overrides with only what it needs
# (principle of least privilege).
permissions:
  contents: read

jobs:
  # ── Job 1: Automatic review on every PR open / push ─────────────────────────
  claude-pr-review:
    name: Automatic PR Review
    # Only run on pull_request events; skip draft PRs
    if: >
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15        # prevent runaway jobs from consuming runner quota
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write          # required by anthropics/claude-code-action for OIDC token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1       # shallow clone is sufficient for direct_prompt review mode

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Instruct Claude to follow the project's review guidelines.
          # CLAUDE.md supplies general coding standards;
          # REVIEW.md supplies review-specific priorities.
          direct_prompt: |
            You are performing a code review for this pull request.

            Follow the review guidelines defined in REVIEW.md (if present) and
            adhere to the coding standards in CLAUDE.md (if present).

            For every file changed:
            1. Check for 🔴 blocking issues first (security, CEI violations,
               missing access control, msg.value mismatches, zero-address gaps).
            2. Then flag 🟡 nits (deprecated patterns, unbounded loops, missing
               events, magic numbers).
            3. Confirm correct SPDX comment format and pragma ordering.
            4. Skip files listed in the "What to Skip" section of REVIEW.md.

            Post inline review comments on specific lines where issues are found.
            Summarise your findings in the top-level review body.

  # ── Job 2: Respond to @claude mentions in PR / issue comments ───────────────
  claude-on-mention:
    name: Respond to @claude Mention
    # Trigger when someone writes "@claude" in a PR comment or review comment
    if: >
      (github.event_name == 'issue_comment' ||
       github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15        # prevent runaway jobs from consuming runner quota
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Note: id-token is intentionally omitted here; @claude mention mode
      # does not require OIDC authentication.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Let Claude read the comment and decide what to do;
          # no direct_prompt here so it operates interactively.
